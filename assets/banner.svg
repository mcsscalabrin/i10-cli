<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="i10-cli: do extrato da B3 para a sua carteira no Investidor10, com datas e preços reais, numa única execução.">
